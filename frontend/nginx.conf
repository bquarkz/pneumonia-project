server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular router deep-linking: any path that isn't a real static file falls back to
    # index.html so client-side routing can take over. Nothing else is proxied — the
    # frontend calls the backend directly at BACKEND_PUBLIC_URL from the browser.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
