name: pneumonia

networks:
  pneumonia-net:
    driver: bridge

volumes:
  postgres-data:
  rabbitmq-data:

services:
  postgres:
    image: postgres:16.1
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_DB: ${KEYCLOAK_DB}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432" # host access for DB clients (IntelliJ, psql, etc.)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pneumonia-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "15672:15672" # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pneumonia-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # No curl/wget in this image (RHEL-minimal base) — bash's /dev/tcp is used instead,
      # against the management interface (port 9000) where health endpoints live.
      test:
        - "CMD-SHELL"
        - >-
          bash -c 'exec 3<>/dev/tcp/localhost/9000 &&
          echo -e "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          cat <&3 | grep -q "\"status\": \"UP\""'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - pneumonia-net

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL}
      XRAY_STORAGE_DIR: ${XRAY_STORAGE_DIR}
      ML_SERVICE_URL: ${ML_SERVICE_URL}
    ports:
      - "8081:8081"
    volumes:
      - ./xray-storage:${XRAY_STORAGE_DIR}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - pneumonia-net

  ml-service:
    build:
      context: ./ml-service
    ports:
      - "8000:8000"
    healthcheck:
      # 127.0.0.1, not localhost: some of these minimal images resolve "localhost" to the
      # IPv6 loopback first, but the process inside only binds the IPv4 wildcard — that
      # combination fails with "connection refused" even though the service is up.
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pneumonia-net

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL}
        KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL}
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost — see the ml-service healthcheck comment above; same failure
      # mode (nginx here binds IPv4-only, "localhost" resolves IPv6-first).
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pneumonia-net
